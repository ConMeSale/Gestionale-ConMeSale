<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Resta in contatto</title>
<style>
:root{--bg:#faf8f5;--fg:#1f1d1a;--mu:#6e6a63;--card:#fff;--bd:#e3ded6;--ac:#c2410c;--ac2:#9a3412;--ok:#15803d;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#171513;--fg:#ece7df;--mu:#a39d93;--card:#211f1c;--bd:#3a3631;--ac:#ea580c;--ac2:#fb923c;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px 40px}
.w{max-width:480px;margin:0 auto}
header{padding:28px 0 12px;text-align:center}header .ic{width:56px;height:56px;border-radius:16px;background:var(--ac);color:#fff;display:inline-grid;place-items:center;font-size:28px;font-weight:700;margin-bottom:10px}
h1{font-size:24px;line-height:1.2;margin:0 0 6px}header p{margin:0;color:var(--mu)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-top:14px}
h2{font-size:18px;margin:0 0 4px}.mu{color:var(--mu);font-size:14px}
label.f{display:block;margin-top:12px;font-weight:600;font-size:14px}label.f span{font-weight:400;color:var(--mu)}
input[type=text],input[type=email],input[type=tel],select{width:100%;margin-top:4px;padding:12px;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:10px}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}
.two{display:flex;gap:8px}.two select{flex:1}
.ck{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:15px}.ck input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--ac)}
button,.btn{display:block;width:100%;margin-top:16px;padding:14px;font:inherit;font-weight:700;border-radius:12px;border:0;background:var(--ac);color:#fff;cursor:pointer;text-align:center;text-decoration:none}
button:disabled{opacity:.6}.sec{background:transparent;color:var(--ac2);border:1.5px solid var(--ac)}
.lnk{background:none;border:0;color:var(--ac2);text-decoration:underline;padding:0;margin:0;width:auto;display:inline;font-weight:400;font-size:inherit}
.err{color:var(--bad);font-size:14px;margin-top:10px}.okm{color:var(--ok);font-weight:600}
.stars{font-size:26px;letter-spacing:4px;color:#f59e0b;text-align:center;margin:4px 0}
.inf{font-size:13px;color:var(--mu);margin-top:10px;border-top:1px solid var(--bd);padding-top:10px}.inf p{margin:6px 0}
footer{text-align:center;margin-top:22px;font-size:13px;color:var(--mu)}
.hid{display:none}
</style></head><body><div class="w" id="app"><header><p class="mu">Caricamento…</p></header></div>
<script>
const SB={url:'https://mmdfkhdwlqinfsviaioi.supabase.co',key:'sb_publishable_QovI3h9zx8hxygxN9H8hqw_1ec05nw2'};
const Q=new URLSearchParams(location.search),TOK=(Q.get('r')||'').replace(/[^a-z0-9]/gi,''),DEMO=Q.get('demo')==='1';
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let INFO=null,REF='';
async function rpc(fn,body){const r=await fetch(SB.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB.key},body:JSON.stringify(body)});const t=await r.text();if(!r.ok)throw new Error(t||String(r.status));return t?JSON.parse(t):null}
const MSG={privacy_obbligatoria:'Per iscriverti conferma di aver letto l\'informativa privacy.',nome_obbligatorio:'Scrivi il tuo nome.',email_non_valida:'Controlla l\'indirizzo email.',troppe_richieste:'Troppe iscrizioni in poco tempo: riprova tra qualche minuto.',link_non_valido:'Questo link non è più attivo.'};
const errMsg=e=>{const m=Object.keys(MSG).find(k=>String(e&&e.message).includes(k));return m?MSG[m]:'Non è stato possibile completare l\'operazione. Controlla la connessione e riprova.'};
const okUrl=u=>/^https:\/\/[^\s"'<>]+$/.test(u||'');
function informativa(){const t=INFO.titolare||INFO.nome,ind=INFO.indirizzo,em=INFO.email;
 return`<p><b>Titolare del trattamento:</b> ${esc(t)}${ind?', '+esc(ind):''}${em?' · '+esc(em):''}.</p>
 <p><b>Quali dati:</b> nome, email${INFO.tel_on!=='0'?', telefono':''}${INFO.compleanno_on!=='0'?', giorno e mese del compleanno':''}, che inserisci tu in questo modulo.</p>
 <p><b>Perché:</b> per registrarti tra i clienti del locale e, solo se lo scegli con l'apposita casella, per inviarti la newsletter con novità, eventi e offerte. Il consenso alla newsletter è facoltativo e puoi revocarlo quando vuoi, con il link «Cancellati dalla newsletter» in fondo a questa pagina o scrivendo al titolare.</p>
 <p><b>Come e per quanto:</b> i dati sono conservati con strumenti informatici, non vengono venduti né ceduti a terzi per loro finalità e restano finché sei iscritto o finché non chiedi di cancellarli.</p>
 <p><b>I tuoi diritti:</b> puoi chiedere al titolare accesso, correzione o cancellazione dei dati, limitarne l'uso od opporti, e puoi presentare reclamo al Garante per la protezione dei dati personali.</p>`}
function revCard(after){if(!okUrl(INFO.recensione))return'';
 return`<div class="c" style="text-align:center"><h2>${after?'Ti è piaciuto?':'Sei già stato da noi?'}</h2><div class="stars" aria-hidden="true">★★★★★</div><p class="mu" style="margin:0">Raccontalo su Google: la tua opinione, qualunque sia, ci aiuta a migliorare e aiuta altri clienti a sceglierci.</p><a class="btn" id="rev" href="${esc(INFO.recensione)}" target="_blank" rel="noopener">Lascia una recensione su Google</a></div>`}
function bindRev(){const a=$('#rev');if(a)a.addEventListener('click',()=>{if(REF&&!DEMO)rpc('crm_pub_click',{p_token:TOK,p_ref:REF}).catch(()=>{})})}
function dd(){let d='<option value="">Giorno</option>';for(let i=1;i<=31;i++)d+=`<option value="${String(i).padStart(2,'0')}">${i}</option>`;const M=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];let m='<option value="">Mese</option>';M.forEach((x,i)=>m+=`<option value="${String(i+1).padStart(2,'0')}">${x}</option>`);return`<div class="two"><select id="cg" aria-label="Giorno">${d}</select><select id="cm" aria-label="Mese">${m}</select></div>`}
function head(){return`<header><div class="ic" aria-hidden="true">${esc((INFO.nome||'?').trim().charAt(0).toUpperCase())}</div><h1>${esc(INFO.nome)}</h1><p>${esc(INFO.benvenuto||'Iscriviti per ricevere novità, serate speciali e offerte riservate ai clienti.')}</p>${DEMO?'<p class="err">Pagina di prova: i dati non vengono salvati.</p>':''}</header>`}
function show(){document.title=INFO.nome+' · Resta in contatto';
 $('#app').innerHTML=head()+`<form class="c" id="fm" novalidate><h2>Resta in contatto</h2><p class="mu" style="margin:0">Bastano pochi secondi.</p>
 <label class="f" for="nm">Nome</label><input type="text" id="nm" autocomplete="name" maxlength="120" required>
 <label class="f" for="em">Email</label><input type="email" id="em" autocomplete="email" inputmode="email" maxlength="160" required>
 ${INFO.tel_on!=='0'?'<label class="f" for="tl">Telefono <span>(facoltativo)</span></label><input type="tel" id="tl" autocomplete="tel" maxlength="40">':''}
 ${INFO.compleanno_on!=='0'?'<label class="f">Compleanno <span>(facoltativo: solo giorno e mese)</span></label>'+dd():''}
 <label class="ck"><input type="checkbox" id="nl"><span>Sì, voglio ricevere la <b>newsletter</b> con novità, eventi e offerte via email.</span></label>
 <label class="ck"><input type="checkbox" id="pv" required><span>Ho letto l'<button type="button" class="lnk" id="ti">informativa privacy</button>.</span></label>
 <div class="inf hid" id="inf">${informativa()}</div>
 <div class="err" id="er" role="alert"></div><button type="submit" id="go">Iscriviti</button></form>
 ${revCard(false)}
 <footer><button type="button" class="lnk" id="un">Cancellati dalla newsletter</button></footer><div id="unb"></div>`;
 $('#ti').onclick=()=>$('#inf').classList.toggle('hid');$('#un').onclick=showUnsub;bindRev();
 $('#fm').onsubmit=async e=>{e.preventDefault();const er=$('#er'),go=$('#go');er.textContent='';
  const nome=$('#nm').value.trim(),email=$('#em').value.trim(),cg=$('#cg'),cm=$('#cm'),comp=cg&&cg.value&&cm.value?cm.value+'-'+cg.value:'';
  if(!nome){er.textContent=MSG.nome_obbligatorio;return $('#nm').focus()}if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){er.textContent=MSG.email_non_valida;return $('#em').focus()}
  if(!$('#pv').checked){er.textContent=MSG.privacy_obbligatoria;return}
  go.disabled=true;go.textContent='Invio…';
  try{if(!DEMO){const r=await rpc('crm_pub_iscrivi',{p_token:TOK,p_nome:nome,p_email:email,p_tel:$('#tl')?$('#tl').value.trim():'',p_compleanno:comp,p_newsletter:$('#nl').checked,p_privacy:true});REF=(r&&r.ref)||''}
   done(nome,$('#nl').checked)}catch(x){er.textContent=errMsg(x);go.disabled=false;go.textContent='Iscriviti'}}}
function done(nome,nl){$('#app').innerHTML=head()+`<div class="c" style="text-align:center"><h2 class="okm">Grazie, ${esc(nome.split(' ')[0])}!</h2><p style="margin:6px 0 0">${nl?'Sei iscritto alla newsletter: ti scriveremo solo per cose che valgono la pena.':'Ti abbiamo registrato tra i nostri clienti.'}</p></div>${revCard(true)}<footer>Puoi chiudere questa pagina.</footer>`;bindRev();scrollTo(0,0)}
function showUnsub(){$('#unb').innerHTML=`<form class="c" id="uf"><h2>Cancellati dalla newsletter</h2><p class="mu" style="margin:0">Scrivi l'email con cui ti sei iscritto: non riceverai più la newsletter.</p><label class="f" for="ue">Email</label><input type="email" id="ue" autocomplete="email" required><div class="err" id="uer" role="alert"></div><button type="submit" class="sec">Cancellami</button></form>`;$('#ue').focus();
 $('#uf').onsubmit=async e=>{e.preventDefault();const em=$('#ue').value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){$('#uer').textContent=MSG.email_non_valida;return}
  try{if(!DEMO)await rpc('crm_pub_disiscrivi',{p_token:TOK,p_email:em});$('#uf').innerHTML='<p class="okm" style="margin:0">Fatto: non riceverai più la newsletter.</p>'}catch(x){$('#uer').textContent=errMsg(x)}}}
function bad(t){$('#app').innerHTML=`<header><h1>Link non valido</h1><p>${esc(t)}</p></header>`}
(async()=>{if(DEMO){INFO={nome:'Pizzeria Da Gigi',benvenuto:'',recensione:'https://www.google.com/search?q=recensioni',titolare:'Pizzeria Da Gigi (esempio)',indirizzo:'',email:'',tel_on:'1',compleanno_on:'1'};show();if(location.hash==='#disiscrivi')showUnsub();return}
 if(!TOK)return bad('Inquadra di nuovo il QR code del locale o chiedi il link al personale.');
 try{INFO=await rpc('crm_pub_info',{p_token:TOK})}catch(e){return bad('Non riesco a collegarmi: controlla la connessione e ricarica la pagina.')}
 if(!INFO)return bad('Questo link non è più attivo. Chiedi al personale il QR code aggiornato.');show();if(location.hash==='#disiscrivi')showUnsub()})();
</script></body></html>
