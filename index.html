<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><title>Gestionale ConMeSale</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf8f5;--fg:#1f1d1a;--mu:#6e6a63;--card:#fff;--bd:#e3ded6;--ac:#c2410c;--ok:#15803d;--bad:#b91c1c;--warn:#fef3c7;--c1:#2563eb;--c2:#d97706;--c3:#7c3aed}

:root[data-theme="dark"]{--bg:#171513;--fg:#f0ece6;--mu:#9d978d;--card:#211f1c;--bd:#37332e;--ac:#fb923c;--ok:#4ade80;--bad:#f87171;--warn:#3a3012;--c1:#60a5fa;--c2:#fbbf24;--c3:#a78bfa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:980px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 10px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}.kp>div{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}.kp small{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.03em}.kp b{font-size:17px}.kp .sub{color:var(--mu);font-size:11px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
nav button,.b{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;max-width:100%}
input[type=number]{width:90px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:5px 6px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
details>summary{cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}.w{background:var(--warn);padding:1px 6px;border-radius:5px;font-size:12px}
.x{border:0;background:none;color:var(--bad);cursor:pointer;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.chips button{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:16px;cursor:pointer;font:inherit}.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.sg{height:34px;max-width:120px;background:#fff;border:1px solid var(--bd);border-radius:4px;cursor:pointer;object-fit:contain;vertical-align:middle}
.th{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--bd);cursor:pointer;margin-right:4px;background:var(--bg);vertical-align:middle}
label{display:flex;gap:6px;align-items:center}
@media(max-width:600px){main{padding:8px}h1{font-size:18px}nav button,.b{padding:8px 10px}input,select{font-size:16px}td,th{padding:4px}.card{padding:8px}input[type=number]{width:80px}details>summary{gap:4px}}
.ceK{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:8px}.ceK .card{margin:0;min-width:0}.ceV{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0}
@media(max-width:760px){.ceK{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:420px){.ceK{grid-template-columns:1fr}}
.ceT td,.ceT th{text-align:right;font-variant-numeric:tabular-nums}.ceT td:first-child,.ceT th:first-child{text-align:left}
.ceT tr.s td{background:var(--bg);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mu);font-weight:600;cursor:pointer;padding-top:9px}
.ceT tr.l td:first-child{padding-left:18px}.ceT tr.t td{font-weight:600}
.ceT tr.k td{background:var(--fg);color:var(--bg);font-weight:700;border-bottom:0}.ceT tr.k td.mu,.ceT tr.k td.ok,.ceT tr.k td.bad{color:var(--bg)}
.pl{display:inline-block;border-radius:10px;padding:1px 7px;font-size:12px;font-weight:600;background:var(--bg)}.pl.ok{background:color-mix(in srgb,var(--ok) 16%,transparent)}.pl.bad{background:color-mix(in srgb,var(--bad) 16%,transparent)}

:root{--sb:#1e1c19;--sbfg:#ece7df;--sbmu:#9b958b;--sbhv:#2c2925}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sb:#0f0e0c;--sbhv:#22201c}}
:root[data-theme="dark"]{--sb:#0f0e0c;--sbhv:#22201c}
.app{display:flex;min-height:100vh}
main{flex:1;min-width:0;max-width:1100px}
.sb{width:236px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--sb);color:var(--sbfg);display:flex;flex-direction:column;padding:14px 10px;box-sizing:border-box}
#nav{flex:1;display:flex;flex-direction:column}

.sbN{display:flex;flex-direction:column;gap:2px;flex:1}
.si{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;color:var(--sbfg);padding:8px 10px;border-radius:8px;font:inherit;font-size:14px;text-align:left;cursor:pointer}
.si:hover{background:var(--sbhv)}.si.on{background:var(--ac);color:#fff}
.si span{flex:1}.si em{font-style:normal;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--sbmu);border:1px solid var(--sbhv);border-radius:5px;padding:1px 5px}.si.on em{color:#fff;border-color:rgb(255 255 255 / .4)}
.si .chv{font-style:normal;font-size:11px;opacity:.8}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sub{display:flex;flex-direction:column;gap:2px;margin:2px 0 4px}.sub .si{padding:6px 10px 6px 38px;color:var(--sbmu)}.sub .si.cur{background:var(--sbhv);color:var(--sbfg);font-weight:600}
.sbSep{height:1px;background:var(--sbhv);margin:10px 4px}
.sbP{display:flex;gap:10px;align-items:center;width:100%;border:0;background:var(--sbhv);color:var(--sbfg);border-radius:10px;padding:10px;margin-top:12px;font:inherit;font-size:14px;text-align:left;cursor:pointer}
.av{width:32px;height:32px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.sbS{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 6px 0;font-size:12px;color:var(--sbmu)}.sbS:empty{display:none}
#sbtn{border:1px solid var(--sbhv);background:none;color:var(--sbmu);border-radius:6px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.tb{display:none;gap:10px;align-items:center;margin-bottom:10px}.sbBg{display:none}
@media(max-width:860px){.sb{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:60;transform:translateX(-105%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
body.sbo .sb{transform:none}body.sbo .sbBg{display:block;position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:55}.tb{display:flex}}
@media(prefers-reduced-motion:reduce){.sb{transition:none}}

/* Business plan */
.bpTop{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}

.tabs button[aria-selected=true]{background:var(--ac);color:#fff}
.bpSec{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;min-width:0}

.bpSec h2{font-size:17px;margin:0}
.note{color:var(--mu);font-size:13px}.label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);font-weight:600}
.num{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
.btn.primary{background:var(--ac);border-color:var(--ac);color:#fff}.btn.danger{color:var(--bad)}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:600;background:var(--bg);color:var(--mu)}.pill.good{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.d-good{color:var(--ok)}.d-bad{color:var(--bad)}

.bpHead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.bpCards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.bpCard{display:flex;flex-direction:column;gap:8px}.bpCardTop{display:flex;justify-content:space-between;gap:8px;align-items:center}
.bpMini{display:flex;gap:20px;flex-wrap:wrap}.bpMini div{display:flex;flex-direction:column;gap:2px}

.bpNarrow{max-width:560px}.bpForm{display:flex;flex-direction:column;gap:14px;margin-top:12px}

.bpCh{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}@media(max-width:760px){.bpCh{grid-template-columns:repeat(2,minmax(0,1fr))}}

.bpOut{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 8px}
.bpSplit{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:10px;align-items:start}@media(max-width:980px){.bpSplit{grid-template-columns:1fr}}

.bpRevL{display:flex;flex-direction:column;gap:4px;border-top:1px solid rgb(255 255 255 / .15);padding-top:8px;font-size:14px}.bpRevL div{display:flex;justify-content:space-between;gap:8px}
table.bpT{min-width:560px}table.bpWide{min-width:1080px}
.bpT th,.bpT td{text-align:right}.bpT th:first-child,.bpT td:first-child{text-align:left}
.bpT input[type=text]{width:100%;min-width:150px;box-sizing:border-box}.bpT input[type=number]{width:110px;text-align:right}
.bpT tr.key td{background:var(--fg);color:var(--bg);font-weight:700}.bpT tr.tot td{font-weight:600}.bpT td.pct{color:var(--mu);font-size:13px}
.radios{display:flex;gap:10px;font-size:13px;color:var(--mu);margin-top:4px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.radios label{display:flex;gap:4px;align-items:center}
.bpVar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}@media(max-width:980px){.bpVar{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bpTot{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg);border-radius:10px;padding:12px 14px;margin-top:12px}
.bpTot>div{display:flex;flex-direction:column;gap:2px}.bpTot b.num{font-size:18px}
.bpK{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}.kpi .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}.kSub{color:var(--mu);font-size:13px}
.kpi dl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:4px 0 0;font-size:12px;color:var(--mu)}.kpi dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mu);flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}

.scroll{overflow-x:auto}

/* Cassa */
.pOv{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.pDlg{width:100%;margin:0;max-height:92vh;overflow:auto;padding:16px}
.pPri{background:var(--ac)!important;color:#fff!important;border-color:var(--ac)!important}.pPri:disabled{opacity:.45;cursor:not-allowed}
.pTop,.pRow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.pBadge{display:inline-block;min-width:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;padding:0 5px;margin-left:3px}
.tabs button[aria-selected=true] .pBadge{background:#fff;color:var(--ac)}
.pStep{display:flex;align-items:center;gap:10px}.pStep b{min-width:26px;text-align:center;font-size:18px;font-variant-numeric:tabular-nums}.pStep .b{width:38px;padding:6px 0}
.pFloor{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;
 background-image:radial-gradient(var(--bd) 1px,transparent 1px);background-size:18px 18px}
.pTab{display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--card));border-radius:10px;padding:6px 6px;cursor:pointer;font:inherit;color:var(--fg);min-height:96px;justify-content:center}

.pTab .tn{font-weight:700;font-size:14px}.pTab .tn small{font-weight:400;color:var(--mu)}.pTab .tt{font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums}.pTab .tm{font-size:11px;color:var(--mu)}
.pList{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pOrdC{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;cursor:pointer;font:inherit;color:var(--fg);margin:0}
.pOrd{display:grid;grid-template-columns:130px minmax(0,1fr) 330px;gap:10px;align-items:start}
@media(max-width:1180px){.pOrd{grid-template-columns:110px minmax(0,1fr)}.pBill{grid-column:1/-1}}
@media(max-width:640px){.pOrd{grid-template-columns:1fr}.pCats{flex-direction:row!important;overflow-x:auto}.pCats button{flex:none}}
.pCats{display:flex;flex-direction:column;gap:4px;background:var(--sb);border-radius:10px;padding:6px;position:sticky;top:8px}

.pCats button.on{background:var(--card);color:var(--fg)}
.pMid{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;min-width:0}
.pHead{display:flex;gap:10px;align-items:center;margin-bottom:10px}.pHead input{flex:1;min-width:120px}
.pUsc{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:10px}

.pProds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

.pKeys{grid-auto-flow:row}

if(!L.prod||!L.scad)return msg('Scegli data di produzione e di scadenza.');if(L.scad<L.prod)return msg('La scadenza è prima della produzione.');
const b=o.querySelector('#lsv');b.disabled=true;msg('Salvo…');
try{for(const i of L.foto.filter(x=>added.includes(x)))await FOTO.put(i,FOTO.c[i])}catch(e){b.disabled=false;return msg(e.message&&e.message.startsWith('Foto')?e.message:'Impossibile salvare le foto: controlla la connessione.')}
if(ex){if(!L.sign)delete ex.sign;Object.assign(ex,L)}else S.lots.push(Object.assign({},L,{id:'l'+Date.now()+Math.random().toString(36).slice(2,5)}));
removed.forEach(i=>FOTO.del(i));o.remove();R()}}
function lotDel(id){ask('Eliminare questo lotto e le sue foto?',()=>{const l=S.lots.find(x=>x.id===id);if(l)(l.foto||[]).forEach(i=>FOTO.del(i));S.lots=S.lots.filter(x=>x.id!==id);R()})}
function delLots(k,r){lotsOf(k,r).forEach(l=>(l.foto||[]).forEach(i=>FOTO.del(i)));S.lots=S.lots.filter(l=>!(l.kind===k&&l.ref===r))}
function lotRow(l,nm){return`<tr>${nm?`<td><b>${esc(lotName(l))}</b><div class="mu">${esc(lotCat(l))}</div></td>`:''}<td>${fd(l.prod)}</td><td>${scBadge(l.scad)}</td><td>${esc(opN(l.op))}${l.sign&&l.sign.op===+l.op?`<div>${sImg(l.sign.sig)}</div><div class="mu">✔ ${dt(l.sign.at)}</div>`:'<div><span class="w">non firmato</span></div>'}</td><td>${esc(l.note||'')}</td><td>${(l.foto||[]).map(i=>fImg(i)).join('')}</td><td><button class="b" onclick="lotDlg('${l.kind}','${l.ref}','${l.id}')">Modifica</button> <button class="x" title="Elimina lotto" onclick="lotDel('${l.id}')">✕</button></td></tr>`}
function tracBlock(k,r){const L=lotsOf(k,r);return`<div style="margin-top:10px"><div class="row" style="margin-bottom:4px"><b>Tracciabilità</b><button class="b" onclick="lotDlg('${k}','${r}')">+ Aggiungi lotto</button></div>${L.length?`<div class="sc"><table><tr><th>Produzione</th><th>Scadenza</th><th>Operatore</th><th>Note</th><th>Etichette</th><th></th></tr>${L.map(l=>lotRow(l)).join('')}</table></div>`:'<div class="mu">Nessun lotto registrato.</div>'}</div>`}
function pSubs(){return S.subs.map(sb=>{const ps=S.preps.filter(p=>p.sub===sb.id&&(!q||p.name.toLowerCase().includes(q)));return`<div class="card" style="border-style:dashed"><div class="row"><b>${esc(sb.name)}</b><button class="b" onclick="subRen('${sb.id}')">Rinomina</button><button class="b" onclick="addPrep('${sb.id}')">+ Aggiungi</button><button class="x" title="Elimina sottocategoria" onclick="subDel('${sb.id}')">✕</button></div>${ps.map(pCard).join('')||'<div class="mu">Nessuna voce: premi «+ Aggiungi».</div>'}</div>`}).join('')+`<div class="row"><button class="b" onclick="addSub()">+ Nuova sottocategoria</button></div>`}
function pCard(p){const n=lotsOf('prep',p.id).length;return`<details class="card" ${open_===p.id?'open':''} ontoggle="if(this.open)open_='${p.id}'"><summary><b>${esc(p.name)}</b><span class="mu">${n} ${n===1?'lotto':'lotti'}</span></summary><div class="row" style="margin-top:8px"><label>Nome <input value="${esc(p.name)}" onchange="S.preps.find(x=>x.id==='${p.id}').name=cap(this.value);R()"></label></div>${tracBlock('prep',p.id)}<div class="row" style="margin-top:8px"><button class="b" onclick="ask('Eliminare questa voce e i suoi lotti?',()=>{delLots('prep','${p.id}');S.preps=S.preps.filter(x=>x.id!=='${p.id}');R()})">Elimina voce</button></div></details>`}
function addPrep(sid){askText('Nome della voce (es. Ragù, Besciamella)',n=>{const p={id:'q'+Date.now(),sub:sid,name:cap(n)};S.preps.push(p);open_=p.id;R()})}
function addSub(){askText('Nome della sottocategoria',n=>{S.subs.push({id:'s'+Date.now(),name:cap(n)});R()})}
function subRen(id){askText('Nuovo nome della sottocategoria',n=>{S.subs.find(x=>x.id===id).name=cap(n);R()})}
function subDel(id){ask('Eliminare la sottocategoria con tutte le sue voci e i lotti?',()=>{S.preps.filter(p=>p.sub===id).forEach(p=>delLots('prep',p.id));S.preps=S.preps.filter(p=>p.sub!==id);S.subs=S.subs.filter(x=>x.id!==id);R()})}
// ===== HACCP: temperature frigo e sanificazione =====
let hsub='trac',tday='',tfr='',tmsg='',tcfg=false;
const HS=[['trac','Tracciabilità'],['temp','Temperature frigo'],['san','Sanificazione']];
const lim=(v,d)=>v===''||v==null||isNaN(+v)?d:+v;
const tOut=(f,v)=>+v<lim(f.min,-Infinity)||+v>lim(f.max,Infinity);
const hasT=v=>v!==undefined&&v!==null&&v!=='';
const opSel=(id,cur,none)=>'<select id="'+id+'">'+(none?'<option value="">— nessuno —</option>':'')+Array.from({length:10},(_,i)=>'<option value="'+i+'" '+(cur!==''&&cur!=null&&+cur===i?'selected':'')+'>'+(i+1)+' · '+esc(opN(i))+'</option>').join('')+'</select>';
function pHaccp(){const chips=`<div class="chips">${HS.map(([k,t])=>`<button class="${hsub===k?'on':''}" onclick="hsub='${k}';R()">${t}</button>`).join('')}</div>`;return chips+(hsub==='temp'?pTemp():hsub==='san'?pSan():pTrac())}
function addFrigo(){if(S.frigos.length>=20)return note('Puoi inserire al massimo 20 frigoriferi.');askText('Nome del frigorifero (es. Frigo banco, Cella)',n=>{S.frigos.push({id:'fr'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),name:cap(n),min:0,max:4});R()})}
function delFrigo(id){const f=S.frigos.find(x=>x.id===id);ask('Eliminare «'+f.name+'» e tutte le sue temperature registrate?',()=>{Object.keys(S.temps).forEach(d=>{delete S.temps[d][id];if(!Object.keys(S.temps[d]).length)delete S.temps[d];const k=d+'|'+id;if(S.tfoto[k]){FOTO.del(S.tfoto[k]);delete S.tfoto[k]}});S.frigos=S.frigos.filter(x=>x.id!==id);R()})}
function setTemp(id,v){if(v!==''&&isNaN(+v))return;const T=S.temps[tday]||(S.temps[tday]={});if(v==='')delete T[id];else T[id]=Math.round(+v*10)/10;if(!Object.keys(T).length)delete S.temps[tday];R()}
async function tFoto(id,inp){const f=inp.files[0];inp.value='';if(!f)return;tmsg='Carico la foto…';R();const k=tday+'|'+id,day=tday;try{const d=await shrink(f),pid='tf'+Date.now().toString(36)+Math.random().toString(36).slice(2,4);await FOTO.put(pid,d);if(S.tfoto[k])FOTO.del(S.tfoto[k]);S.tfoto[k]=pid;tmsg=''}catch(e){tmsg=e.message&&e.message.startsWith('Foto')?e.message:'Impossibile salvare la foto: controlla la connessione.'}R()}
function tFotoDel(id){const k=tday+'|'+id;if(S.tfoto[k]){FOTO.del(S.tfoto[k]);delete S.tfoto[k]}R()}
function pTemp(){if(!tday)tday=td();const fr=S.frigos,T=S.temps[tday]||{};
const done=fr.filter(f=>hasT(T[f.id])).length,bad=fr.filter(f=>hasT(T[f.id])&&tOut(f,T[f.id])).length;
const rows=fr.map(f=>{const v=T[f.id],h=hasT(v),out=h&&tOut(f,v),pid=S.tfoto[tday+'|'+f.id];
return`<tr><td><b>${esc(f.name)}</b><div class="mu">limiti ${lim(f.min,'–')} … ${lim(f.max,'–')} °C</div></td><td><input type="number" step="0.1" style="width:84px" value="${h?v:''}" placeholder="°C" onchange="setTemp('${f.id}',this.value)"> °C ${h?(out?'<b class="bad">fuori limite</b>':'<span class="ok">ok</span>'):''}</td><td>${pid?fImg(pid)+`<button class="x" title="Togli foto" onclick="tFotoDel('${f.id}')">✕</button>`:`<label class="b" style="cursor:pointer">📷 Foto<input type="file" accept="image/*" capture="environment" style="display:none" onchange="tFoto('${f.id}',this)"></label>`}</td></tr>`}).join('');
const cfg=fr.map(f=>`<tr><td><input value="${esc(f.name)}" onchange="S.frigos.find(x=>x.id==='${f.id}').name=cap(this.value);R()"></td><td><input type="number" step="0.5" style="width:70px" value="${f.min??''}" onchange="S.frigos.find(x=>x.id==='${f.id}').min=this.value===''?'':+this.value;R()"></td><td><input type="number" step="0.5" style="width:70px" value="${f.max??''}" onchange="S.frigos.find(x=>x.id==='${f.id}').max=this.value===''?'':+this.value;R()"></td><td><button class="x" onclick="delFrigo('${f.id}')">✕</button></td></tr>`).join('');
const hist=[];Object.keys(S.temps).sort().reverse().forEach(d=>fr.filter(f=>!tfr||f.id===tfr).forEach(f=>{const v=S.temps[d][f.id];if(hasT(v))hist.push({d,f,v})}));
const hr=hist.slice(0,80).map(x=>{const o=tOut(x.f,x.v),pid=S.tfoto[x.d+'|'+x.f.id];return`<tr><td>${fd(x.d)}</td><td>${esc(x.f.name)}</td><td>${o?'<b class="bad">':'<b>'}${String(x.v).replace('.',',')} °C</b></td><td>${o?'<b class="bad">fuori limite</b>':'<span class="ok">ok</span>'}</td><td>${pid?fImg(pid):''}</td><td>${hasT(S.top[x.d])?esc(opN(S.top[x.d])):''}</td></tr>`}).join('');
return`<div class="card"><b>Temperature frigo</b><div class="mu">Registra ogni giorno la temperatura di ogni frigorifero, con la foto del display. Fuori dai limiti il valore diventa rosso.</div></div>
<div class="row"><label>Giorno <input type="date" value="${tday}" max="${td()}" onchange="tday=this.value||td();R()"></label><label>Operatore ${opSel('top',S.top[tday],true).replace('<select id="top"','<select id="top" onchange="if(this.value===\'\')delete S.top[tday];else S.top[tday]=+this.value;R()"')}</label><span class="mu">${fr.length?done+' di '+fr.length+' registrate'+(bad?' · <b class="bad">'+bad+' fuori limite</b>':''):''}</span></div>
${tmsg?'<div class="mu">'+esc(tmsg)+'</div>':''}
${fr.length?`<div class="card sc"><table><tr><th>Frigorifero</th><th>Temperatura</th><th>Foto</th></tr>${rows}</table></div>`:'<div class="card mu">Nessun frigorifero: premi «+ Aggiungi frigo».</div>'}
<div class="row"><button class="b" onclick="addFrigo()">+ Aggiungi frigo (${fr.length}/20)</button></div>
${fr.length?`<details class="card" ${tcfg?'open':''} ontoggle="tcfg=this.open"><summary><b>Nomi e limiti dei frigoriferi</b></summary><div class="sc"><table><tr><th>Nome</th><th>Min °C</th><th>Max °C</th><th></th></tr>${cfg}</table></div><div class="mu">Esempi: frigo 0 … 4 °C, congelatore −22 … −18 °C.</div></details>`:''}
${fr.length?`<div class="row"><b>Storico</b><select onchange="tfr=this.value;R()"><option value="">Tutti i frigoriferi</option>${fr.map(f=>`<option value="${f.id}" ${tfr===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></div><div class="card sc"><table><tr><th>Data</th><th>Frigo</th><th>Temperatura</th><th>Esito</th><th>Foto</th><th>Operatore</th></tr>${hr||'<tr><td class="mu">Nessuna temperatura registrata.</td></tr>'}</table></div>`:''}`}
function signBox(o,L,sel){const el=o.querySelector(sel);const f=()=>{const i=+L.op;let h='';if(L.sign&&L.sign.op===i)h='<div class="mu">✔ Firmato da <b>'+esc(opN(i))+'</b> · '+dt(L.sign.at)+'</div>'+sImg(L.sign.sig);else if(S.opPin[i])h='<button class="b" id="sgb">✍️ Firma ('+esc(opN(i))+')</button>';else h='<button class="b" id="sgb">✍️ Imposta firma e PIN di '+esc(opN(i))+'</button>';el.innerHTML=h;fotoHydrate();const b=el.querySelector('#sgb');if(b)b.onclick=()=>{if(S.opPin[i])pinDlg(i,()=>{L.sign={op:i,sig:S.opSig[i],at:new Date().toISOString()};f()});else opSetup(i,f)}};f();return f}
function areasDlg(cb){const o=dlg('');const draw=()=>{o.firstChild.innerHTML='<b>Aree e attività di sanificazione</b>'+S.sanAreas.map((a,i)=>'<div style="display:flex;gap:6px;align-items:center;margin:4px 0"><span style="flex:1">'+esc(a)+'</span><button class="x" data-d="'+i+'" title="Elimina">✕</button></div>').join('')+'<div class="row" style="margin-top:8px"><button class="b" id="aa">+ Aggiungi</button><button class="b" id="ax">Chiudi</button></div>';
o.firstChild.querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{S.sanAreas.splice(+b.dataset.d,1);draw();if(cb)cb()});
o.firstChild.querySelector('#aa').onclick=()=>askText('Nome area o attività (es. Friggitrice)',n=>{S.sanAreas.push(cap(n));draw();if(cb)cb()});
o.firstChild.querySelector('#ax').onclick=()=>{o.remove();R()}};draw()}
function sanDlg(){const L={op:0};const aOpts=()=>S.sanAreas.map(a=>'<option>'+esc(a)+'</option>').join('');
const o=dlg('<b>Nuova sanificazione</b><div class="row" style="margin-top:8px"><label>Data <input type="date" id="sd" value="'+td()+'"></label></div><div class="row"><label>Area / attività <select id="sa">'+aOpts()+'</select></label><button class="b" id="sg2">Gestisci aree</button></div><label style="display:block;margin-bottom:8px">Prodotto usato <input id="sp" style="width:100%;box-sizing:border-box" placeholder="es. sanificante alimentare"></label><label style="display:block;margin-bottom:8px">Note <input id="sn" style="width:100%;box-sizing:border-box"></label><div class="row"><label>Operatore '+opSel('so',0)+'</label><button class="b" id="sr">Rinomina operatori</button></div><div id="ssg" style="margin-bottom:8px"></div><div class="row"><button class="b" id="ssv">Salva</button><button class="b" id="sx">Annulla</button></div><div class="mu" id="sm"></div>');
const msg=t=>{o.querySelector('#sm').textContent=t||''};const f=signBox(o,L,'#ssg'),so=o.querySelector('#so');
so.onchange=()=>{L.op=+so.value;if(L.sign&&L.sign.op!==L.op)delete L.sign;f()};
o.querySelector('#sr').onclick=()=>opDlg(()=>{const c=+so.value;so.outerHTML=opSel('so',c);const n=o.querySelector('#so');n.onchange=()=>{L.op=+n.value;if(L.sign&&L.sign.op!==L.op)delete L.sign;f()};L.op=c;f()});
o.querySelector('#sg2').onclick=()=>areasDlg(()=>{o.querySelector('#sa').innerHTML=aOpts()});
o.querySelector('#sx').onclick=()=>o.remove();
o.querySelector('#ssv').onclick=()=>{const day=o.querySelector('#sd').value,area=o.querySelector('#sa').value;if(!day)return msg('Scegli la data.');if(!area)return msg('Scegli l\'area (o aggiungila con «Gestisci aree»).');
L.op=+o.querySelector('#so').value;if(!L.sign||L.sign.op!==L.op)return msg('Serve la firma con PIN dell\'operatore.');
S.san.push({id:'sn'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),day,area,prod:o.querySelector('#sp').value.trim(),note:o.querySelector('#sn').value.trim(),op:L.op,sign:L.sign});o.remove();R()}}
function sanDel(id){ask('Eliminare questa registrazione di sanificazione?',()=>{S.san=S.san.filter(x=>x.id!==id);R()})}
function pSan(){const all=S.san.slice().sort((a,b)=>(b.day+(b.sign&&b.sign.at||'')).localeCompare(a.day+(a.sign&&a.sign.at||'')));
const rows=all.slice(0,150).map(x=>`<tr><td>${fd(x.day)}</td><td><b>${esc(x.area)}</b></td><td>${esc(x.prod||'')}</td><td>${esc(opN(x.op))}<div>${x.sign?sImg(x.sign.sig):''}</div><div class="mu">${x.sign?'✔ '+dt(x.sign.at):''}</div></td><td>${esc(x.note||'')}</td><td><button class="x" title="Elimina" onclick="sanDel('${x.id}')">✕</button></td></tr>`).join('');
return`<div class="card"><b>Sanificazione</b><div class="mu">Registra ogni pulizia e sanificazione: l'operatore conferma con il suo PIN e la sua firma.</div></div>
<div class="row"><button class="b" onclick="sanDlg()">+ Nuova sanificazione</button><button class="b" onclick="areasDlg()">Aree e attività</button><button class="b" onclick="opDlg()">Nomi operatori</button><span class="mu">${all.length} registrazioni</span></div>
<div class="card sc"><table><tr><th>Data</th><th>Area / attività</th><th>Prodotto</th><th>Operatore e firma</th><th>Note</th><th></th></tr>${rows||'<tr><td class="mu">Nessuna registrazione.</td></tr>'}</table></div>`}
function pTrac(){const all=S.lots.slice().sort((a,b)=>(a.scad||'9999').localeCompare(b.scad||'9999'));
const sc=all.filter(l=>dleft(l.scad)!==null&&dleft(l.scad)<0).length,pr=all.filter(l=>dleft(l.scad)!==null&&dleft(l.scad)>=0&&dleft(l.scad)<=2).length;
const f=all.filter(l=>(!tq||(lotName(l)+' '+(l.note||'')+' '+opN(l.op)).toLowerCase().includes(tq))&&(tf==='tutti'||(tf==='scaduti'&&dleft(l.scad)!==null&&dleft(l.scad)<0)||(tf==='prossimi'&&dleft(l.scad)!==null&&dleft(l.scad)>=0&&dleft(l.scad)<=2)));
return`<div class="card"><b>Tracciabilità</b><div class="mu">Tutti i lotti, ordinati per scadenza. Per aggiungerne uno apri il piatto (o la voce in Secondi piatti → Sughi e salse) e premi «+ Aggiungi lotto».</div></div>
<div class="row"><input id="tq" placeholder="Cerca piatto, operatore, nota…" value="${esc(tq)}" oninput="tq=this.value.toLowerCase();R();document.getElementById('tq').focus()"><select onchange="tf=this.value;R()"><option value="tutti" ${tf==='tutti'?'selected':''}>Tutti</option><option value="prossimi" ${tf==='prossimi'?'selected':''}>In scadenza (2 giorni)</option><option value="scaduti" ${tf==='scaduti'?'selected':''}>Scaduti</option></select><button class="b" onclick="opDlg()">Nomi operatori</button><span class="mu">${all.length} lotti · ${sc} scaduti · ${pr} in scadenza</span></div>
<div class="card sc"><table><tr><th>Piatto</th><th>Produzione</th><th>Scadenza</th><th>Operatore</th><th>Note</th><th>Etichette</th><th></th></tr>${f.map(l=>lotRow(l,true)).join('')||'<tr><td class="mu">Nessun lotto.</td></tr>'}</table></div>`}

function pPar(){const f=(k,t,s)=>`<label>${t} <input type="number" step="${s}" min="0" value="${S.p[k]}" onchange="S.p.${k}=+this.value;R()"></label>`;
return`<div class="card"><b>Fatture di acquisto</b><div class="row" style="margin-top:8px"><button class="b" onclick="view='fatt';R()">📄 Carica e consulta le fatture</button><span class="mu">${S.fatt.length} salvate</span></div></div>
<div class="card"><b>Costi mensili dell'attività</b><div class="row" style="margin-top:8px">${[['luce','Luce'],['dip','Dipendenti'],['gas','Gas'],['affitto','Affitto'],['acqua','Acqua'],['spazz','Spazzatura'],['altro','Altro']].map(([k,l])=>costBox(k,l,false)).join('')}</div><div class="mu">Totale costi mensili <b>${eur(totC())}</b></div></div>

function aggr(m){const A={};Array.from(new Set(Object.keys(S.rev).concat(Object.keys(S.vend)))).forEach(k=>{const v=S.rev[k]||{},p=pk(k,m);A[p]=A[p]||{};CH.forEach(([c])=>A[p][c]=(A[p][c]||0)+(+v[c]||0));A[p]._cm=(A[p]._cm||0)+dCm(k);A[p]._pz=(A[p]._pz||0)+vTot(k)});

function impMerge(m){const names={};S.ing.forEach(i=>{names[i.name.trim().toLowerCase()]=i.id});const idm={};let ni=0,nd=0,np_=0;
(m.ing||[]).forEach(i=>{if(i.auto)return;const k=String(i.name||'').trim().toLowerCase();if(names[k]){idm[i.id]=names[k];const ex=S.ing.find(x=>x.id===names[k]);if(ex&&!ex.auto&&!ex.price&&+i.price>0){ex.price=+i.price;if(i.unit)ex.unit=i.unit;if(i.iva!=null)ex.iva=i.iva;np_++}return}let id=i.id;if(!id||S.ing.some(x=>x.id===id))id='i'+Date.now()+'_'+ni;const c=Object.assign({},i,{id});S.ing.push(c);names[k]=id;idm[i.id]=id;ni++});

function ensureBP(){if(!S.bp)S.bp={active:null,scen:[]}}
const curScen=()=>S.bp&&S.bp.scen.find(x=>x.id===BPU.sid);
const countM=(da,a)=>da<=a?a-da+1:12-da+1+a;
const inRange=(m,da,a)=>da<=a?m>=da&&m<=a:(m>=da||m<=a);
const netSc=(s,c)=>(+s.channels[c].sc||0)/(1+(+s.iva||0)/100);
function bpMonth(s,i){const M=s.months[i],m=i+1,V=s.var,r={};
 CH_BP.forEach(([c])=>r[c]=(+M.cov[c]||0)*(+M.days||0)*netSc(s,c));
 r.sala=r.pranzo+r.cena;r.R=r.sala+r.asporto+r.delivery;r.bev=r.sala*(+V.bevQ||0)/100;r.food=r.R-r.bev;
 r.cogsF=r.food*(+V.fc||0)/100;r.cogsB=r.bev*(+V.bc||0)/100;r.comm=r.delivery*(+V.comm||0)/100;r.varA=r.R*(+V.altro||0)/100;r.VAR=r.cogsF+r.cogsB+r.comm+r.varA;
 r.lab={personale:0,manager:0,premi:0};s.staff.forEach(x=>{const v=x.imp==='stagionale'?(inRange(m,+x.da,+x.a)?(+x.costo||0)/countM(+x.da,+x.a):0):(+x.costo||0)/12;r.lab[x.ruolo]=(r.lab[x.ruolo]||0)+v});
 r.LAB=r.lab.personale+r.lab.manager+r.lab.premi;
 r.fix={};r.FIX=0;s.fissi.forEach(x=>{const imp=+x.importo||0;let v;if(x.per==='custom')v=inRange(m,+x.da,+x.a)?(x.freq==='mese'?imp:imp/countM(+x.da,+x.a)):0;else v=x.freq==='mese'?imp:imp/12;r.fix[x.ce]=(r.fix[x.ce]||0)+v;r.FIX+=v});
 r.AMM=s.capex.reduce((a,x)=>a+((+x.anni||0)>0?(+x.importo||0)/x.anni:0),0)/12;
 r.EBIT=r.R-r.VAR-r.LAB-r.FIX-r.AMM;return r}
function bpYear(s){const M=s.months.map((_,i)=>bpMonth(s,i)),T={};
 ['R','VAR','LAB','FIX','AMM','EBIT'].forEach(k=>T[k]=M.reduce((a,x)=>a+x[k],0));
 T.capex=s.capex.reduce((a,x)=>a+(+x.importo||0),0);T.COST=T.VAR+T.LAB+T.FIX+T.AMM;T.varR=T.R?T.VAR/T.R:0;T.FIXED=T.LAB+T.FIX+T.AMM;
 T.BEP=T.varR<1?T.FIXED/(1-T.varR):Infinity;T.days=s.months.reduce((a,x)=>a+(+x.days||0),0);
 const cy=T.EBIT+T.AMM;T.payback=T.capex<=0?0:cy>0?T.capex/cy*12:Infinity;return{M,T}}

 <div class="bpAct" style="justify-content:space-between">${act?'<span></span>':`<button class="btn" type="button" onclick="bpApply()">${BPU.arm?'Conferma: sostituisci lo scenario attivo':'Rendi attivo e usa come budget'}</button>`}<button class="btn primary" type="button" onclick="bpStep('pres')">Prosegui →</button></div>

 <div class="panel"><div class="panel-head"><h2>Scontrino medio per canale</h2><label class="inl"><span class="label">IVA %</span><input type="number" id="bp_iva" data-b="iva" value="${s.iva}" min="0" max="22" step="1" style="width:70px"></label></div>
 <p class="note" style="margin:0 0 10px">Vale per tutto l'anno. Inserisci lo scontrino con IVA; nei ricavi entra il netto.</p>

 <div class="bpSplit"><div class="panel"><div class="panel-head"><h2>Coperti medi al giorno · ${MESI_L[mi]}</h2><label class="inl"><span class="label">Giorni aperti</span><input type="number" id="bp_days" min="0" max="31" data-b="months.${mi}.days" value="${M.days}" style="width:70px"></label></div>
 <div class="scroll"><table class="bpT"><thead><tr><th>Canale</th><th>Coperti al giorno</th><th>Coperti nel mese</th><th>Ricavi netti</th></tr></thead><tbody>${CH_BP.map(([c,l])=>`<tr><td>${l}</td><td><input type="number" id="bp_cov_${c}" min="0" data-b="months.${mi}.cov.${c}" value="${M.cov[c]}"></td><td class="num" data-o="cm_${c}"></td><td class="num" data-o="cr_${c}"></td></tr>`).join('')}</tbody></table></div>
 <div class="bpAct"><button class="btn" type="button" onclick="bpCopy()">${BPU.copyArm?'Conferma: sovrascrivi i coperti degli altri mesi':'Copia i coperti di '+MESI_L[mi]+' su tutti i mesi'}</button></div></div>
 <div class="bpRev"><span class="label">Ricavi previsti · ${MESI_L[mi]}</span><span class="v num" data-o="rev"></span><div class="bpRevL">${CH_BP.map(([c,l])=>`<div><span>${l}</span><span class="num" data-o="cr2_${c}"></span></div>`).join('')}</div><div class="bpRevL"><div><span>Totale anno</span><span class="num" data-o="revY"></span></div></div></div></div>
 <div class="bpAct" style="justify-content:flex-end;margin-top:0"><button class="btn primary" type="button" onclick="bpStep('costi')">Prosegui ai costi →</button></div>`}
const mSel=(path,v,id)=>`<select id="${id}" data-b="${path}" data-n>${MESI.map((m,i)=>`<option value="${i+1}"${+v===i+1?' selected':''}>${m}</option>`).join('')}</select>`;

function bpCosti(s){const V=s.var,vf=(k,l,h)=>`<label class="fld"><span class="label">${l}</span><input type="number" id="bp_v_${k}" step="0.5" min="0" max="100" data-b="var.${k}" value="${V[k]}"><span class="note">${h}</span></label>`;
 return`<div class="panel"><div class="panel-head"><h2>Costi variabili</h2><span class="note" data-o="vtot"></span></div><div class="bpVar">
 ${vf('fc','Food cost %','sui ricavi food')}${vf('bevQ','Quota beverage %','dei ricavi di pranzo e cena')}${vf('bc','Beverage cost %','sui ricavi beverage')}${vf('comm','Commissioni delivery %','sui ricavi delivery')}${vf('altro','Altri variabili %','consumabili, POS, sui ricavi totali')}</div></div>
 <div class="panel"><div class="panel-head"><h2>Investimenti iniziali</h2><button class="btn" type="button" onclick="bpAdd('capex')">+ Aggiungi</button></div>
 ${s.capex.length?`<div class="scroll"><table class="bpT"><thead><tr><th>Voce di spesa</th><th>Importo €</th><th>Anni di ammortamento</th><th>Ammortamento annuo</th><th></th></tr></thead><tbody>${s.capex.map((x,i)=>`<tr><td><input type="text" id="bp_cx_v${i}" data-b="capex.${i}.voce" value="${esc(x.voce)}" placeholder="es. Arredi"></td><td><input type="number" id="bp_cx_i${i}" min="0" data-b="capex.${i}.importo" value="${x.importo}"></td><td><input type="number" id="bp_cx_a${i}" min="1" max="30" data-b="capex.${i}.anni" value="${x.anni}" style="width:80px"></td><td class="num" data-o="ca_${i}"></td><td><button class="iconbtn" type="button" aria-label="Elimina voce" onclick="bpRm('capex',${i})">✕</button></td></tr>`).join('')}</tbody></table></div>`:`<p class="note" style="margin:0">Nessun investimento. Aggiungi voci come arredi, impianti, attrezzature o acquisto della licenza.</p>`}
 <div class="bpTot"><div><b>Fabbisogno iniziale</b><span class="note">capitale necessario per partire</span></div><div style="text-align:right"><b class="num" data-o="ctot"></b><span class="note">ammortamento <span data-o="camm"></span>/anno</span></div></div></div>
 <div class="panel"><div class="panel-head"><h2>Organico e staff</h2><button class="btn" type="button" onclick="bpAdd('staff')">+ Aggiungi</button></div><p class="note" style="margin:0 0 8px">Costo annuo per l'azienda, contributi compresi. Gli stagionali pesano solo nei mesi indicati.</p>
 <div class="scroll"><table class="bpT"><thead><tr><th>Nome</th><th>Ruolo</th><th>Costo annuo €</th><th>Impiego</th><th></th></tr></thead><tbody>${s.staff.map((x,i)=>`<tr><td><input type="text" id="bp_st_n${i}" data-b="staff.${i}.nome" value="${esc(x.nome)}" placeholder="es. Cuoco"></td><td>${sel(`staff.${i}.ruolo`,RUOLI,x.ruolo,'bp_st_r'+i)}</td><td><input type="number" id="bp_st_c${i}" min="0" data-b="staff.${i}.costo" value="${x.costo}"></td>
 <td><div class="radios"><label><input type="radio" name="imp${i}" id="bp_st_a${i}" data-b="staff.${i}.imp" data-rr value="annuale"${x.imp!=='stagionale'?' checked':''}>Annuale</label><label><input type="radio" name="imp${i}" id="bp_st_s${i}" data-b="staff.${i}.imp" data-rr value="stagionale"${x.imp==='stagionale'?' checked':''}>Stagionale</label></div>${x.imp==='stagionale'?`<div class="radios">da ${mSel(`staff.${i}.da`,x.da,'bp_st_da'+i)} a ${mSel(`staff.${i}.a`,x.a,'bp_st_aa'+i)}</div>`:''}</td>
 <td><button class="iconbtn" type="button" aria-label="Elimina" onclick="bpRm('staff',${i})">✕</button></td></tr>`).join('')}</tbody></table></div>
 <div class="bpTot"><div><b>Totale staff</b><span class="note">incidenza sul fatturato <span data-o="sinc"></span></span></div><b class="num" data-o="stot"></b></div></div>
 <div class="panel"><div class="panel-head"><h2>Costi fissi</h2><button class="btn" type="button" onclick="bpAdd('fissi')">+ Aggiungi</button></div><p class="note" style="margin:0 0 8px">La colonna "Nel conto economico" dice in quale voce del budget finisce ogni costo.</p>
 <div class="scroll"><table class="bpT"><thead><tr><th>Voce di spesa</th><th>Importo €</th><th>Frequenza</th><th>Nel conto economico</th><th>Periodo</th><th></th></tr></thead><tbody>${s.fissi.map((x,i)=>`<tr><td><input type="text" id="bp_fx_v${i}" data-b="fissi.${i}.voce" value="${esc(x.voce)}" placeholder="es. Affitto"></td><td><input type="number" id="bp_fx_i${i}" min="0" data-b="fissi.${i}.importo" value="${x.importo}"></td>
 <td>${sel(`fissi.${i}.freq`,[['mese','al mese'],['anno',"all'anno"]],x.freq,'bp_fx_f'+i)}</td><td>${sel(`fissi.${i}.ce`,CE_FIX,x.ce,'bp_fx_c'+i)}</td>
 <td><div class="radios"><label><input type="radio" name="per${i}" id="bp_fx_pa${i}" data-b="fissi.${i}.per" data-rr value="anno"${x.per!=='custom'?' checked':''}>Tutto l'anno</label><label><input type="radio" name="per${i}" id="bp_fx_pc${i}" data-b="fissi.${i}.per" data-rr value="custom"${x.per==='custom'?' checked':''}>Personalizzato</label></div>${x.per==='custom'?`<div class="radios">da ${mSel(`fissi.${i}.da`,x.da,'bp_fx_da'+i)} a ${mSel(`fissi.${i}.a`,x.a,'bp_fx_aa'+i)}</div>`:''}</td>
 <td><button class="iconbtn" type="button" aria-label="Elimina" onclick="bpRm('fissi',${i})">✕</button></td></tr>`).join('')}</tbody></table></div>
 <div class="bpTot"><div><b>Totale costi fissi</b><span class="note">all'anno</span></div><b class="num" data-o="ftot"></b></div></div>
 <div class="bpAct" style="justify-content:flex-end;margin-top:0"><button class="btn primary" type="button" onclick="bpStep('analisi')">Vai all'analisi →</button></div>`}
function bpAnalisi(c,s){const{M,T}=bpYear(s),act=c.bp.active===s.id,mg=T.R?T.EBIT/T.R:NaN;
 const bepDays=isFinite(T.BEP)&&T.R?Math.ceil(T.BEP/T.R*365):Infinity;
 const pb=T.capex<=0?['Nessun investimento','non ci sono spese iniziali da recuperare']:isFinite(T.payback)?[Math.ceil(T.payback)+' mesi','per recuperare '+fE(T.capex)]:['Non rientra','con questi numeri la cassa non copre l\'investimento'];
 let h=`<div class="bpK">
 <div class="kpi"><span class="label">Fatturato annuo</span><span class="v">${fE(T.R)}</span><span class="kSub">${T.days} giorni di apertura</span></div>
 <div class="kpi"><span class="label">Costi totali</span><span class="v">${fE(T.COST)}</span><dl><dt>Variabili</dt><dd>${fE(T.VAR)}</dd><dt>Personale</dt><dd>${fE(T.LAB)}</dd><dt>Fissi</dt><dd>${fE(T.FIX)}</dd><dt>Ammortamenti</dt><dd>${fE(T.AMM)}</dd></dl></div>
 <div class="kpi"><span class="label">Utile operativo</span><span class="v ${T.EBIT>=0?'d-good':'d-bad'}">${fE(T.EBIT)}</span><span class="kSub">margine ${fP(mg)}</span></div>
 <div class="kpi"><span class="label">Punto di pareggio</span><span class="v">${isFinite(T.BEP)?fE(T.BEP):'—'}</span><span class="kSub">${!isFinite(bepDays)?'i costi variabili superano i ricavi':bepDays<=365?'raggiunto dopo circa '+bepDays+' giorni':'non raggiunto nell\'anno'}</span></div>
 <div class="kpi"><span class="label">Tempo di rientro</span><span class="v">${pb[0]}</span><span class="kSub">${pb[1]}</span></div></div>
 <div class="panel"><div class="panel-head"><h2>Analisi del punto di pareggio</h2><div class="legend"><span><i style="background:var(--c1)"></i>Ricavi</span><span><i style="background:var(--bad)"></i>Costi totali</span><span><i style="background:var(--mu)"></i>Costi fissi</span></div></div>${beChart(T)}
 <p class="note">Sull'asse orizzontale il fatturato annuo. Dove la linea dei ricavi supera quella dei costi l'attività è in utile. I costi variabili pesano il ${fP(T.varR)} dei ricavi.</p></div>`;
 const rows=[['Ricavi','R','rev'],['Costi variabili','VAR'],['Personale','LAB'],['Costi fissi','FIX'],['Ammortamenti','AMM'],['Utile operativo','EBIT','key']];
 h+=`<div class="panel" style="padding:0"><div class="panel-head" style="padding:16px 16px 0"><h2>Conto economico mensile</h2><span class="note">valori netti, senza IVA</span></div><div class="scroll"><table class="bpT bpWide"><thead><tr><th>Voce</th>${MESI.map(m=>`<th>${m}</th>`).join('')}<th>Totale</th></tr></thead><tbody>
 ${rows.map(([l,k,cl])=>`<tr class="${cl==='key'?'key':cl==='rev'?'tot':''}"><td>${l}</td>${M.map(x=>`<td class="num">${kf(x[k])}</td>`).join('')}<td class="num"><b>${fE(T[k])}</b></td></tr>`).join('')}
 <tr><td>Margine</td>${M.map(x=>`<td class="num pct">${x.R?fP(x.EBIT/x.R):'—'}</td>`).join('')}<td class="num pct">${fP(mg)}</td></tr></tbody></table></div></div>`;
 let cum=-T.capex;const cf=M.map(x=>{cum+=x.EBIT+x.AMM;return{f:x.EBIT+x.AMM,c:cum}});
 h+=`<div class="panel"><div class="panel-head"><h2>Cash flow previsionale</h2><span class="note">cassa cumulata, partendo dall'investimento iniziale</span></div>${cfChart(-T.capex,cf)}
 <div class="scroll" style="margin-top:10px"><table class="bpT bpWide"><thead><tr><th></th><th>Inizio</th>${MESI.map(m=>`<th>${m}</th>`).join('')}</tr></thead><tbody>
 <tr><td>Flusso del mese</td><td class="num">${kf(-T.capex)}</td>${cf.map(x=>`<td class="num ${x.f<0?'d-bad':''}">${kf(x.f)}</td>`).join('')}</tr>
 <tr class="tot"><td>Cassa cumulata</td><td class="num">${kf(-T.capex)}</td>${cf.map(x=>`<td class="num ${x.c<0?'d-bad':'d-good'}">${kf(x.c)}</td>`).join('')}</tr></tbody></table></div>
 <p class="note">Stima semplificata: utile operativo più ammortamenti, senza IVA, imposte, finanziamenti e tempi di pagamento dei fornitori.</p></div>
 <div class="panel"><div class="panel-head"><h2>Budget del conto economico</h2>${act?'<span class="pill good">attivo</span>':''}</div>
 <p class="note" style="margin:0">${act?`Questo scenario è il budget ${s.year}: lo trovi nella colonna Budget del conto economico, mese per mese.`:`Rendendo attivo lo scenario, i suoi numeri diventano la colonna Budget del conto economico ${s.year}.`}</p>
 <div class="bpAct">${act?`<button class="btn primary" type="button" onclick="ceF='${s.year}-01';ceT='${s.year}-12';navGo('ce')">Apri il conto economico ${s.year}</button>`:`<button class="btn primary" type="button" onclick="bpApply()">${BPU.arm?'Conferma: sostituisci lo scenario attivo':'Rendi attivo e usa come budget'}</button>`}</div>${BPU.msg?`<p class="bpMsg">${BPU.msg}</p>`:''}</div>`;
 return h}
function beChart(T){const X=(Math.max(T.R,isFinite(T.BEP)?T.BEP:0)*1.15)||1,cost=x=>T.FIXED+T.varR*x,Y=Math.max(X,cost(X));
 const W=720,H=270,pl=58,pb=28,pt=14,pr=16,iw=W-pl-pr,ih=H-pb-pt,sx=x=>pl+x/X*iw,sy=y=>pt+ih-y/Y*ih;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Grafico del punto di pareggio">`;
 const ys=niceStep(Y),xs=niceStep(X);
 for(let v=0;v<=Y+1;v+=ys)s+=`<line x1="${pl}" x2="${W-pr}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--bd)" fill="none"/><text x="${pl-6}" y="${sy(v)+3}" text-anchor="end">${kf(v)}</text>`;
 for(let v=0;v<=X+1;v+=xs)s+=`<text x="${sx(v)}" y="${H-8}" text-anchor="middle">${kf(v)}</text>`;
 s+=`<line x1="${sx(0)}" y1="${sy(T.FIXED)}" x2="${sx(X)}" y2="${sy(T.FIXED)}" stroke="var(--mu)" stroke-dasharray="4 4" fill="none"/>`;
 s+=`<line x1="${sx(0)}" y1="${sy(cost(0))}" x2="${sx(X)}" y2="${sy(cost(X))}" stroke="var(--bad)" stroke-width="2.5" fill="none"/>`;
 s+=`<line x1="${sx(0)}" y1="${sy(0)}" x2="${sx(X)}" y2="${sy(X)}" stroke="var(--c1)" stroke-width="2.5" fill="none"/>`;
 s+=`<line x1="${sx(T.R)}" y1="${pt}" x2="${sx(T.R)}" y2="${pt+ih}" stroke="var(--c1)" stroke-dasharray="2 4" fill="none"/><text x="${sx(T.R)-6}" y="${pt+12}" text-anchor="end">previsto ${kf(T.R)}</text>`;
 if(isFinite(T.BEP)&&T.BEP<=X)s+=`<circle cx="${sx(T.BEP)}" cy="${sy(T.BEP)}" r="5" fill="var(--card)" stroke="var(--fg)" stroke-width="2"/><text x="${sx(T.BEP)+8}" y="${sy(T.BEP)+16}">pareggio ${kf(T.BEP)}</text>`;
 return s+'</svg>'}
function cfChart(start,cf){const vals=[start].concat(cf.map(x=>x.c)),mn=Math.min(0,...vals),mx=Math.max(0,...vals),span=(mx-mn)||1;
 const W=720,H=220,pl=58,pb=24,pt=10,pr=10,iw=W-pl-pr,ih=H-pb-pt,sy=v=>pt+(mx-v)/span*ih,gw=iw/vals.length,bw=Math.min(30,gw*.6);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cassa cumulata mese per mese">`;const st=niceStep(span);
 for(let v=Math.ceil(mn/st)*st;v<=mx+1;v+=st)s+=`<line x1="${pl}" x2="${W-pr}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--bd)" fill="none"/><text x="${pl-6}" y="${sy(v)+3}" text-anchor="end">${kf(v)}</text>`;
 vals.forEach((v,i)=>{const x=pl+gw*i+gw/2,y0=sy(0),y1=sy(v);s+=`<rect x="${x-bw/2}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(1,Math.abs(y1-y0))}" rx="2" fill="${v<0?'var(--bad)':'var(--ac)'}"><title>${i?MESI_L[i-1]:'Inizio'}: ${fE(v)}</title></rect><text x="${x}" y="${H-6}" text-anchor="middle">${i?MESI[i-1]:'Inizio'}</text>`});
 return s+`<line x1="${pl}" x2="${W-pr}" y1="${sy(0)}" y2="${sy(0)}" stroke="var(--fg)" fill="none"/></svg>`}
function bpFill(){const s=curScen();if(!s)return;const{M,T}=bpYear(s),mi=BPU.month,O={};
 M.forEach((x,i)=>O['m'+i]=kf(x.R)+' €');
 CH_BP.forEach(([c])=>{O['net_'+c]=eur2.format(netSc(s,c));O['cm_'+c]=Math.round((+s.months[mi].cov[c]||0)*(+s.months[mi].days||0)).toLocaleString('it-IT');O['cr_'+c]=O['cr2_'+c]=fE(M[mi][c])});
 O.rev=fE(M[mi].R);O.revY=fE(T.R);
 s.capex.forEach((x,i)=>O['ca_'+i]=fE((+x.anni||0)>0?(+x.importo||0)/x.anni:0));O.ctot=fE(T.capex);O.camm=fE(T.AMM);
 O.stot=fE(T.LAB);O.sinc=fP(T.R?T.LAB/T.R:NaN);O.ftot=fE(T.FIX);O.vtot=fE(T.VAR)+' all\'anno · '+fP(T.R?T.VAR/T.R:NaN)+' dei ricavi';
 document.querySelectorAll('#v [data-o]').forEach(el=>{const v=O[el.dataset.o];if(v!==undefined)el.textContent=v})}

const bpActive=()=>S.bp&&S.bp.scen.find(x=>x.id===S.bp.active);
function bpBudget(from,to){const s=bpActive(),t={has:false};if(!s)return t;
 mList(from,to).forEach(m=>{if(+m.slice(0,4)!==+s.year)return;const r=bpMonth(s,+m.slice(5,7)-1),add=(k,v)=>t[k]=(t[k]||0)+v;t.has=true;
  add('sala',r.sala);add('asporto',r.asporto);add('delivery',r.delivery);add('mp',r.cogsF);add('bev',r.cogsB);add('lab',r.LAB);add('comm',r.comm);add('cons',r.varA);add('amm',r.AMM);
  Object.entries(r.fix).forEach(([k,v])=>add(k,v))});
 t.name=s.name;return t}

/* ===== Clienti su questo dispositivo ===== */
function profList(){let L=[];try{L=JSON.parse(localStorage.getItem('ce_profs')||'[]')}catch(e){}if(!L.some(p=>p.id===''))L.unshift({id:'',name:''});return L}
function profSave(L){try{localStorage.setItem('ce_profs',JSON.stringify(L))}catch(e){}}
function profSync(){if(!NOLOGIN)return;const L=profList(),me=L.find(p=>p.id===PROF);if(!me)return;if(!S.p.locale&&me.name)S.p.locale=me.name;else if(me.name!==(S.p.locale||'')){me.name=S.p.locale||'';profSave(L)}}
function profDlg(){if(!NOLOGIN)return locName();const L=profList();
const o=dlg(`<b>Clienti</b><p class="mu" style="margin:4px 0 8px">Ogni cliente ha i suoi dati separati su questo dispositivo: piatti, incassi, costi, business plan.</p>${L.map((p,i)=>`<div class="row" style="justify-content:space-between;margin:4px 0;padding:6px 0;border-bottom:1px solid var(--bd)"><span>${esc(p.name||'Il mio locale')}${p.id===PROF?' <span class="w">aperto</span>':''}</span><span>${p.id===PROF?'<button class="b" data-a="ren">Rinomina</button>':`<button class="b" data-a="open" data-i="${i}">Apri</button>${p.id?` <button class="x" data-a="del" data-i="${i}" title="Elimina cliente">✕</button>`:''}`}</span></div>`).join('')}<div class="row" style="margin-top:12px"><input id="pn" placeholder="Nome del nuovo cliente" style="flex:1;min-width:160px"><button class="b" id="pa">+ Nuovo cliente</button></div><div class="row" style="margin:0"><button class="b" id="px">Chiudi</button></div>`);
o.querySelector('#px').onclick=()=>o.remove();
o.querySelector('#pa').onclick=()=>{const n=o.querySelector('#pn').value.trim();if(!n)return o.querySelector('#pn').focus();const id='c'+Date.now();L.push({id,name:n});profSave(L);save();try{localStorage.setItem('ce_prof',id)}catch(e){}location.reload()};
o.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=b.dataset.a,p=L[+b.dataset.i];
 if(a==='ren'){o.remove();locName();return}
 if(a==='open'){save();try{p.id?localStorage.setItem('ce_prof',p.id):localStorage.removeItem('ce_prof')}catch(e){}location.reload();return}
 if(a==='del'){o.remove();ask('Eliminare il cliente «'+(p.name||'Il mio locale')+'» e tutti i suoi dati da questo dispositivo? Non si può annullare.',()=>{['ce1','ce_ver','ce_last','ce_taken'].forEach(k=>{try{localStorage.removeItem(k+'_p'+p.id)}catch(e){}});profSave(L.filter(x=>x!==p));setTimeout(profDlg,50)})}})}
/* ===== Cassa: sala, tavoli, comande, conto ===== */
const TIP=[['food','Food'],['vino','Vino'],['birra','Birra'],['acqua','Acqua'],['bibite','Bibite'],['caffe','Caffè'],['alcolici','Alcolici'],['altro','Altro']];
const tipOf=d=>d.tip||(d.cat==='bevande'?'bibite':'food');
function posInit(){
 if(!S.sale)S.sale=[{id:'r1',name:'Sala principale',tables:Array.from({length:10},(_,i)=>({id:'t'+(i+1),name:'T'+(i+1),posti:4}))},{id:'r2',name:'Dehor',tables:Array.from({length:6},(_,i)=>({id:'d'+(i+1),name:'D'+(i+1),posti:4}))}];
 if(!S.cam)S.cam=['Cameriere 1','Cameriere 2'];
 if(!S.ordini)S.ordini=[];if(!S.storico)S.storico=[];
 if(S.p.coperto==null)S.p.coperto=2;if(S.p.extraP==null)S.p.extraP=1}
const POS={tab:'sala',room:null,ord:null,cat:'tutti',q:'',usc:1,buf:'',qty:1,sto:ymd(new Date()),stoOpen:null,edit:false};
const posId=()=>'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const posOrd=()=>S.ordini.find(o=>o.id===POS.ord);
const lineP=l=>(+l.p||0)+(l.add||[]).reduce((s,a)=>s+(+a.p||0),0);
const ordSub=o=>o.righe.reduce((s,l)=>s+lineP(l)*(+l.q||0),0);
const ordCop=o=>o.tipo==='sala'?(+o.cop||0)*(+S.p.coperto||0):0;
const ordTot=o=>Math.round((ordSub(o)+ordCop(o)-(+o.sconto||0))*100)/100;
const r2=v=>Math.round(v*100)/100;
const minFrom=t=>Math.max(0,Math.round((Date.now()-new Date(t))/60000));
const TIPI_ORD=[['sala','Sala'],['banco','Banco'],['asporto','Asporto'],['delivery','Delivery']];
const DEL_CH=[['glovo','Glovo'],['justeat','Just Eat'],['deliveroo','Deliveroo'],['ecom','E-commerce'],['extra','Altra piattaforma']];

/* overlay più largo del dlg standard */
function posDlg(html,w){const o=document.createElement('div');o.className='pOv';o.innerHTML='<div class="card pDlg" style="max-width:'+(w||420)+'px">'+html+'</div>';o.addEventListener('click',e=>{if(e.target===o)o.remove()});document.body.appendChild(o);return o}

function pCassa(){posInit();const o=posOrd();if(POS.ord&&!o)POS.ord=null;
 const tabs=`<div class="pTop"><div class="tabs" role="tablist">${TIPI_ORD.map(([k,l])=>`<button type="button" role="tab" aria-selected="${POS.tab===k&&!POS.ord}" onclick="POS.tab='${k}';POS.ord=null;R()">${l}${k!=='sala'&&S.ordini.some(x=>x.tipo===k)?` <span class="pBadge">${S.ordini.filter(x=>x.tipo===k).length}</span>`:''}</button>`).join('')}<button type="button" role="tab" aria-selected="${POS.tab==='storico'&&!POS.ord}" onclick="POS.tab='storico';POS.ord=null;R()">Storico</button></div>
 <span class="mu">Coperto ${eur(+S.p.coperto||0)} · <a href="#" onclick="posSettings();return false" style="color:var(--ac)">Impostazioni cassa</a></span></div>`;
 if(POS.ord)return pOrder(posOrd());
 if(POS.tab==='sala')return tabs+pSala();
 if(POS.tab==='storico')return tabs+pStorico();
 return tabs+pAltri(POS.tab)}

function pSala(){const rooms=S.sale;if(!rooms.length)rooms.push({id:'r'+Date.now(),name:'Sala',tables:[]});
 if(!rooms.some(r=>r.id===POS.room))POS.room=rooms[0].id;const r=rooms.find(x=>x.id===POS.room);
 const chips=`<div class="pRow"><div class="chips" style="margin:0">${rooms.map(x=>`<button class="${x.id===POS.room?'on':''}" onclick="POS.room='${x.id}';R()">${esc(x.name)}</button>`).join('')}</div><button class="b" onclick="POS.edit=!POS.edit;R()">${POS.edit?'Fine modifica':'Modifica sala'}</button></div>`;
 if(POS.edit)return chips+pSalaEdit(r);
 const occ=S.ordini.filter(x=>x.tipo==='sala');
 const tb=r.tables.map(t=>{const ord=occ.find(x=>x.tav===t.id);const n=Math.min(+t.posti||0,12),seats='<i></i>'.repeat(Math.ceil(n/2));
  return`<button class="pTab ${ord?'busy':''}" onclick="posTable('${r.id}','${t.id}')" aria-label="Tavolo ${esc(t.name)}${ord?', occupato':', libero'}"><span class="seats">${seats}</span><span class="tn">${esc(t.name)} <small>(${t.posti})</small></span>${ord?`<span class="tt">${eur(ordTot(ord))}</span><span class="tm">${ord.cop} cop. · ${minFrom(ord.aperto)} min</span>`:(()=>{const pr=prToday(t.id);return pr?`<span class="tm pr">${pr.h} ${esc(pr.nome)} (${pr.cop})</span>`:'<span class="tm">libero</span>'})()}<span class="seats">${seats}</span></button>`}).join('');
 return chips+`<div class="pFloor">${tb||'<div class="mu">Nessun tavolo in questa sala: premi «Modifica sala» per aggiungerli.</div>'}</div>
 <div class="mu" style="margin-top:8px">${occ.length} tavoli aperti · ${occ.reduce((s,x)=>s+(+x.cop||0),0)} coperti in sala</div>`}

function pSalaEdit(r){return`<div class="card"><div class="row"><label>Nome sala <input value="${esc(r.name)}" onchange="posRoom('${r.id}').name=cap(this.value);R()"></label><button class="b" onclick="posAddRoom()">+ Nuova sala</button>${S.sale.length>1?`<button class="x" title="Elimina sala" onclick="posDelRoom('${r.id}')">✕ Elimina sala</button>`:''}</div>
 <div class="sc"><table><tr><th>Tavolo</th><th>Posti</th><th></th></tr>${r.tables.map((t,i)=>`<tr><td><input value="${esc(t.name)}" onchange="posRoom('${r.id}').tables[${i}].name=this.value.trim()||'T';R()" style="width:120px"></td><td><input type="number" min="1" max="30" value="${t.posti}" onchange="posRoom('${r.id}').tables[${i}].posti=Math.max(1,+this.value||1);R()" style="width:70px"></td><td><button class="x" title="Elimina tavolo" onclick="posDelTable('${r.id}',${i})">✕</button></td></tr>`).join('')}</table></div>
 <div class="row" style="margin-top:8px"><button class="b" onclick="posAddTables('${r.id}',1)">+ Aggiungi tavolo</button><button class="b" onclick="posAddTables('${r.id}',5)">+ 5 tavoli</button></div></div>`}
const posRoom=id=>S.sale.find(x=>x.id===id);
function posAddRoom(){askText('Nome della nuova sala',n=>{const r={id:'r'+Date.now(),name:cap(n),tables:[]};S.sale.push(r);POS.room=r.id;R()})}
function posDelRoom(id){if(S.ordini.some(o=>o.room===id))return note('Ci sono tavoli aperti in questa sala: chiudili prima di eliminarla.');ask('Eliminare questa sala e i suoi tavoli?',()=>{S.sale=S.sale.filter(x=>x.id!==id);POS.room=null;R()})}
function posAddTables(rid,n){const r=posRoom(rid),pre=(r.tables[0]&&String(r.tables[0].name).replace(/\d+$/,''))||'T';let k=r.tables.length;for(let i=0;i<n;i++){k++;r.tables.push({id:'t'+Date.now()+'_'+i,name:pre+k,posti:4})}R()}
function posDelTable(rid,i){const r=posRoom(rid),t=r.tables[i];if(S.ordini.some(o=>o.tav===t.id))return note('Il tavolo è aperto: chiudi il conto prima di eliminarlo.');r.tables.splice(i,1);R()}

function posTable(rid,tid){const ord=S.ordini.find(x=>x.tipo==='sala'&&x.tav===tid);if(ord){POS.ord=ord.id;POS.cat='tutti';POS.usc=1;R();return}
 const r=posRoom(rid),t=r.tables.find(x=>x.id===tid);let cop=+t.posti||2;
 const o=posDlg(`<b style="font-size:17px">Apri tavolo ${esc(t.name)}</b><div class="mu">Coperti e cameriere</div>
 <div class="row" style="margin-top:12px;align-items:flex-end"><div><div class="label">Coperti</div><div class="pStep"><button class="b" id="cm" aria-label="Meno">−</button><b id="cv">${cop}</b><button class="b" id="cp" aria-label="Più">+</button></div></div>
 <label style="flex-direction:column;align-items:stretch;flex:1"><span class="label">Cameriere</span><select id="cc"><option value="">Seleziona…</option>${camList().map(c=>`<option>${esc(c)}</option>`).join('')}</select></label></div>
 <div class="row" style="margin-top:14px"><button class="b" id="cx">Annulla</button><button class="b pPri" id="ok">Apri tavolo</button></div>`,340);
 const show=()=>o.querySelector('#cv').textContent=cop;o.querySelector('#cm').onclick=()=>{cop=Math.max(0,cop-1);show()};o.querySelector('#cp').onclick=()=>{cop++;show()};
 o.querySelector('#cx').onclick=()=>o.remove();
 o.querySelector('#ok').onclick=()=>{const ord={id:posId(),tipo:'sala',room:rid,tav:tid,tavN:t.name,cop,cam:o.querySelector('#cc').value,righe:[],aperto:new Date().toISOString(),sconto:0};S.ordini.push(ord);o.remove();POS.ord=ord.id;POS.cat='tutti';POS.usc=1;POS.q='';R()}}

function pAltri(tipo){const L=S.ordini.filter(x=>x.tipo===tipo);const lab={banco:'Banco',asporto:'Asporto',delivery:'Delivery'}[tipo];
 return`<div class="pRow"><b>${lab}: ${L.length} ${L.length===1?'ordine aperto':'ordini aperti'}</b><button class="b pPri" onclick="posNew('${tipo}')">+ Nuovo ordine</button></div>
 <div class="pList">${L.map(o=>`<button class="card pOrdC" onclick="POS.ord='${o.id}';POS.cat='tutti';POS.usc=1;R()"><b>${esc(o.nome||lab)}</b>${o.tipo==='delivery'?`<span class="w">${esc((DEL_CH.find(c=>c[0]===o.canale)||[0,''])[1])}</span>`:''}<span class="mu">${o.righe.reduce((s,l)=>s+(+l.q||0),0)} articoli · ${minFrom(o.aperto)} min</span><b>${eur(ordTot(o))}</b></button>`).join('')||`<div class="mu">Nessun ordine ${lab.toLowerCase()} aperto.</div>`}</div>`}
function posNew(tipo){if(tipo==='banco'){const n=S.ordini.filter(x=>x.tipo==='banco').length+1;const ord={id:posId(),tipo,nome:'Banco '+n,righe:[],aperto:new Date().toISOString(),sconto:0};S.ordini.push(ord);POS.ord=ord.id;POS.cat='tutti';R();return}
 const o=posDlg(`<b style="font-size:17px">Nuovo ordine ${tipo==='asporto'?'da asporto':'delivery'}</b><label style="flex-direction:column;align-items:stretch;margin-top:10px"><span class="label">Nome cliente</span><input id="nn" placeholder="es. Rossi"></label>${tipo==='delivery'?`<label style="flex-direction:column;align-items:stretch;margin-top:8px"><span class="label">Piattaforma</span><select id="ch">${DEL_CH.map(([k,l])=>`<option value="${k}">${k==='extra'?esc(S.p.extraName||l):l}</option>`).join('')}</select></label>`:''}<div class="row" style="margin-top:14px"><button class="b" id="cx">Annulla</button><button class="b pPri" id="ok">Crea ordine</button></div>`,340);
 const i=o.querySelector('#nn');i.focus();o.querySelector('#cx').onclick=()=>o.remove();
 const go=()=>{const ord={id:posId(),tipo,nome:cap(i.value.trim()||(tipo==='asporto'?'Asporto':'Delivery')),canale:tipo==='delivery'?o.querySelector('#ch').value:'',righe:[],aperto:new Date().toISOString(),sconto:0};S.ordini.push(ord);o.remove();POS.ord=ord.id;POS.cat='tutti';POS.usc=1;R()};
 o.querySelector('#ok').onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()}}

/* ---- comanda ---- */
const posDishes=()=>S.dishes.filter(d=>d.cat!=='sughi'&&!d.off);
function pOrder(o){const ds=posDishes();const cats=PC.filter(([k])=>k!=='sughi'&&ds.some(d=>catOf(d)===k));
 if(POS.cat!=='tutti'&&!cats.some(c=>c[0]===POS.cat))POS.cat='tutti';
 const list=ds.filter(d=>(POS.cat==='tutti'||catOf(d)===POS.cat)&&(!POS.q||d.name.toLowerCase().includes(POS.q))).sort((a,b)=>a.name.localeCompare(b.name));
 const title=o.tipo==='sala'?esc(o.tavN):esc(o.nome||'Ordine');
 const sub=o.tipo==='sala'?`${o.cop} coperti${o.cam?' · '+esc(o.cam):''}`:({banco:'Banco',asporto:'Asporto',delivery:'Delivery · '+esc((DEL_CH.find(c=>c[0]===o.canale)||[0,''])[1])})[o.tipo];
 const usc=o.tipo==='sala'?`<div class="pUsc">${[1,2,3,4,5].map(u=>`<button class="${POS.usc===u?'on':''}" onclick="POS.usc=${u};R()">${u}ª uscita</button>`).join('')}</div>`:'';
 const prods=list.map(d=>`<button class="pProd" onclick="posAdd('${d.id}')"><span>${esc(d.name)}</span><b>${eur(+d.sale||0)}${d.peso?'/kg':''}</b></button>`).join('');
 const groups={};o.righe.forEach(l=>{(groups[l.u||1]=groups[l.u||1]||[]).push(l)});
 const rows=Object.keys(groups).sort().map(u=>`${o.tipo==='sala'?`<div class="pUh">${u}ª uscita</div>`:''}${groups[u].map(l=>`<button class="pLine" onclick="posLine('${l.id}')"><span class="q">${l.q}×</span><span class="n">${esc(l.n)}${l.g?` <small>(${l.g} g)</small>`:''}${(l.rm||[]).length?`<small class="bad">senza ${esc(l.rm.join(', '))}</small>`:''}${(l.add||[]).length?`<small class="ok">+ ${esc(l.add.map(a=>a.n).join(', '))}</small>`:''}${l.note?`<small>📝 ${esc(l.note)}</small>`:''}</span><span class="v">${eur(lineP(l)*l.q)}</span></button>`).join('')}`).join('');
 const qv=POS.buf?parseInt(POS.buf,10):POS.qty,vv=POS.buf?(+POS.buf/100):0;
 const keys=`<div class="pQ"><div><span class="label">Quantità</span><b>${POS.qty}×</b></div><div style="text-align:right"><span class="label">Valore libero</span><b>${eur(vv)}</b></div></div>
 <div class="pKeys">${[1,2,3,5,10].map(n=>`<button class="${POS.qty===n&&!POS.buf?'on':''}" onclick="POS.qty=${n};POS.buf='';R()">+${n}</button>`).join('')}
 ${['1','2','3','C','⌫','4','5','6','SETX','LIB','7','8','9','00','0'].map(k=>k==='C'?`<button class="kc" onclick="POS.buf='';POS.qty=1;R()">C</button>`:k==='SETX'?`<button class="kx" onclick="posSetX()">SET ×</button>`:k==='LIB'?`<button class="kx" onclick="posFree()" title="Aggiunge una voce con il valore digitato">Voce €</button>`:k==='⌫'?`<button onclick="POS.buf=POS.buf.slice(0,-1);R()" aria-label="Cancella cifra">⌫</button>`:k==='OK'?`<button class="kx" onclick="posSetX()">OK</button>`:`<button onclick="POS.buf=(POS.buf+'${k}').slice(0,7);R()">${k}</button>`).join('')}</div>`;
 return`<div class="pOrd">
 <aside class="pCats"><button class="${POS.cat==='tutti'?'on':''}" onclick="POS.cat='tutti';R()">Tutti</button>${cats.map(([k,t])=>`<button class="${POS.cat===k?'on':''}" onclick="POS.cat='${k}';R()">${t}</button>`).join('')}</aside>
 <section class="pMid"><div class="pHead"><button class="iconbtn" onclick="POS.ord=null;R()" aria-label="Chiudi comanda">✕</button><div><b style="font-size:17px">${title}</b><div class="mu">${sub}</div></div><input id="pq" placeholder="Cerca prodotto…" value="${esc(POS.q)}" oninput="POS.q=this.value.toLowerCase();R();const e=document.getElementById('pq');e.focus();e.setSelectionRange(e.value.length,e.value.length)"><button class="iconbtn" title="Annulla ordine" aria-label="Annulla ordine" onclick="posDelOrd('${o.id}')">🗑</button></div>
 ${usc}<div class="pProds">${prods||'<div class="mu">Nessun prodotto in vendita. Aggiungi pietanze in Distinte base e attiva «In vendita».</div>'}</div></section>
 <aside class="pBill"><div class="pBh"><b>Riepilogo conto</b>${o.tipo==='sala'?`<span class="pCop">Coperti: <button onclick="posCop(-1)" aria-label="Meno coperti">−</button>${o.cop} × ${eur(+S.p.coperto||0)}<button onclick="posCop(1)" aria-label="Più coperti">+</button></span>`:''}</div>
 <div class="pLines">${rows||'<div class="mu" style="text-align:center;padding:18px 0;font-style:italic">Nessun prodotto</div>'}${ordCop(o)?`<div class="pLine st"><span class="q"></span><span class="n">Coperto (${o.cop})</span><span class="v">${eur(ordCop(o))}</span></div>`:''}${+o.sconto?`<div class="pLine st"><span class="q"></span><span class="n">Sconto</span><span class="v bad">−${eur(+o.sconto)}</span></div>`:''}</div>
 <div class="pTot"><div><span class="label">Totale</span><a href="#" onclick="posSconto();return false">${+o.sconto?'Modifica sconto':'+ Aggiungi sconto'}</a></div><b>${eur(ordTot(o))}</b></div>
 ${keys}
 <div class="row" style="margin:8px 0 0"><button class="b" style="flex:1" onclick="posPreconto()">Preconto</button><button class="b pPri" style="flex:2" onclick="posPay()" ${o.righe.length||ordCop(o)?'':'disabled'}>Chiudi conto</button></div></aside></div>`}
function posCop(n){const o=posOrd();o.cop=Math.max(0,(+o.cop||0)+n);R()}
function posSetX(){const n=parseInt(POS.buf,10);if(n>0)POS.qty=Math.min(n,999);POS.buf='';R()}
function posFree(){const v=+POS.buf/100;if(!(v>0))return note('Digita prima l\'importo sul tastierino (es. 1 2 5 0 = 12,50 €), poi premi «Voce €».');const o=posOrd();o.righe.push({id:posId(),d:'',n:'Varie',p:v,q:POS.qty,u:POS.usc,rm:[],add:[],note:''});POS.buf='';POS.qty=1;R()}
function posAdd(did){const d=dish(did),o=posOrd();if(!d||!o)return;
 const push=(g)=>{const p=d.peso?r2((+d.sale||0)*g/1000):(+d.sale||0);const same=!d.peso&&o.righe.find(l=>l.d===did&&l.u===POS.usc&&!(l.rm||[]).length&&!(l.add||[]).length&&!l.note);
  if(same)same.q+=POS.qty;else o.righe.push({id:posId(),d:did,n:d.name,p,q:POS.qty,u:POS.usc,rm:[],add:[],note:'',g:d.peso?g:undefined});POS.qty=1;POS.buf='';R()};
 if(d.peso){const o2=posDlg(`<b style="font-size:17px">${esc(d.name)}</b><div class="mu">${eur(+d.sale||0)}/kg · vendita al peso</div><label style="flex-direction:column;align-items:stretch;margin-top:10px"><span class="label">Grammi</span><input id="gg" type="number" min="1" step="10" value="${POS.buf?parseInt(POS.buf,10):''}" placeholder="es. 450"></label><div class="mu" id="gp" style="margin-top:6px"></div><div class="row" style="margin-top:12px"><button class="b" id="cx">Annulla</button><button class="b pPri" id="ok">Aggiungi</button></div>`,320);
  const i=o2.querySelector('#gg'),upd=()=>o2.querySelector('#gp').textContent=+i.value>0?'Prezzo: '+eur(r2((+d.sale||0)*i.value/1000)):'';upd();i.oninput=upd;i.focus();
  o2.querySelector('#cx').onclick=()=>o2.remove();const go=()=>{const g=Math.round(+i.value);if(!(g>0))return i.focus();o2.remove();POS.buf='';push(g)};o2.querySelector('#ok').onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()};return}
 push(0)}
function posLine(lid){const o=posOrd(),l=o.righe.find(x=>x.id===lid);if(!l)return;const d=l.d?dish(l.d):null;
 const st={tab:d?'rm':'note',rm:[...(l.rm||[])],add:(l.add||[]).map(a=>Object.assign({},a)),note:l.note||'',q:l.q,u:l.u||1,f:''};
 const ingN=d?[...new Set(d.lines.map(x=>{const i=ing(x.ing);return i?i.name:''}).filter(Boolean))]:[];

let mtab='gia',mq='';
function magInit(){if(!S.mag)S.mag={min:{},inv:{},mov:[]}}
const magItems=()=>{const L=[];S.ing.forEach(i=>{if(i.auto&&!(i.apz&&i.imp&&(S.imps.find(m=>m.id===i.imp)||{}).type==='comprato'))return;L.push({id:i.id,name:i.name,u:i.unit==='pz'||i.apz?'pz':'kg',tipo:i.apz?'Impasto acquistato':'Ingrediente'})});
 S.fmt.forEach(f=>L.push({id:'f_'+f.id,name:f.name,u:'kg',tipo:f.kind==='fresca'?'Pasta fresca':'Pasta secca'}));return L.sort((a,b)=>a.name.localeCompare(b.name))};
function consOf(id,amount,acc,dep){if(dep>6||!(amount>0))return;const i=ing(id);if(!i)return;
 if(i.auto&&i.sugo){const d=dish(i.sugo);if(!d)return;const y=sInfo(d).y;if(!(y>0))return;d.lines.forEach(l=>consOf(l.ing,(+l.qty||0)*amount/y,acc,dep+1));return}
 if(i.apz){const m=S.imps.find(x=>x.id===i.imp);if(m&&m.type!=='comprato'&&m.type!=='pasta'){const L=impL(m),g=L.reduce((s,l)=>s+(+l.qty||0),0),n=g/(+m.peso||1);if(n>0)L.forEach(l=>consOf(l.ing,(+l.qty||0)*amount/n,acc,dep+1));return}acc[id]=(acc[id]||0)+amount;return}
 acc[id]=(acc[id]||0)+(i.unit==='pz'?amount:amount/1000)}

function dishUse(d){const key=d.id;const acc={};d.lines.forEach(l=>consOf(l.ing,+l.qty||0,acc,0));if(d.cat==='primi'&&d.pf&&+d.pg)acc['f_'+d.pf]=(acc['f_'+d.pf]||0)+(+d.pg)/1000;return acc}
function salesUse(){const days={},cache={};Object.keys(S.vend).forEach(k=>{const acc={};Object.entries(S.vend[k]).forEach(([id,q])=>{const d=dish(id);if(!d)return;const u=cache[id]||(cache[id]=dishUse(d));Object.entries(u).forEach(([x,v])=>acc[x]=(acc[x]||0)+v*(+q||0))});days[k]=acc});return days}

 S.mag.mov.forEach(m=>{if(m.ing===it.id&&m.t!=='inventario'&&m.ts>since)q+=+m.q});let sold=0;Object.keys(days).forEach(k=>{if(k>sd&&days[k][it.id])sold+=days[k][it.id]});out[it.id]={q:q-sold,sold,inv}});return out}

 const its=magItems().filter(x=>!mq||x.name.toLowerCase().includes(mq)),st=stock();
 const search=`<div class="row"><input id="mq" placeholder="Cerca prodotto…" value="${esc(mq)}" oninput="mq=this.value.toLowerCase();R();const e=document.getElementById('mq');e.focus();e.setSelectionRange(e.value.length,e.value.length)" style="flex:1;max-width:340px"></div>`;

 return{dish:find(/^piatt/,/prodott/,/ricett/),ing:find(/^ingred/,/component/,/materia/),qty:find(/quantit/,/^q ta/,/^qta/,/grammi/,/dose/),u:find(/^unita/,/^um$/,/misura/)}}

 if(/\.csv$|\.txt$/i.test(file.name)){let txt=new TextDecoder('utf-8').decode(buf);if(txt.includes('\uFFFD'))txt=new TextDecoder('windows-1252').decode(buf);const fs=(txt.split('\n')[0].match(/;/g)||[]).length>=(txt.split('\n')[0].match(/,/g)||[]).length?';':',';wb=X.read(txt.replace(/^﻿/,''),{type:'string',FS:fs,raw:true})}

 const out=[];wb.SheetNames.forEach(n=>{const rows=X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));if(rows.length<1)return;const hdr=rows[0].map(String),kind=detectKind(/\.csv$/i.test(file.name)?file.name:n,hdr);out.push({sheet:n,kind,hdr,map:kind?mapHdr(kind,hdr):null,rows:rows.slice(1)})});return out}
function xlsPlan(sheets,opt){const P={ing:{nw:[],up:[]},dish:{nw:[],up:[]},rec:{dishes:{},miss:new Set()},skip:[],unknown:[]};

 sheets.forEach(sh=>{if(!sh.kind){P.unknown.push(sh.sheet);return}const m=sh.map,g=(r,k)=>m[k]>=0?r[m[k]]:'';
  if(m[sh.kind==='rec'?'dish':'name']<0){P.unknown.push(sh.sheet+' (manca la colonna del nome)');return}
  sh.rows.forEach((r,ix)=>{const row=ix+2;
   if(sh.kind==='ing'){const name=cap(String(g(r,'name')).trim());if(!name)return;const o={name,unit:unitOf(g(r,'unit')),price:numIt(g(r,'price')),conf:numIt(g(r,'conf')),sw:numIt(g(r,'sw')),sg:numIt(g(r,'sg')),iva:numIt(g(r,'iva')),tip:tipKey(g(r,'tip')),min:numIt(g(r,'min'))};

    if(ex)P.ing.up.push([ex,o]);else if(!newIng[nrm(name)]){newIng[nrm(name)]=o;P.ing.nw.push(o)}}
   else if(sh.kind==='dish'){const name=cap(String(g(r,'name')).trim());if(!name)return;const o={name,cat:catKey(g(r,'cat')),tip:tipKey(g(r,'tip')),sale:numIt(g(r,'sale')),iva:numIt(g(r,'iva')),on:siNo(g(r,'on')),peso:siNo(g(r,'peso')),fcT:numIt(g(r,'fcT')),por:numIt(g(r,'por')),resa:numIt(g(r,'resa')),pf:String(g(r,'pf')).trim(),pg:numIt(g(r,'pg'))};
    const ex=dishBy[nrm(name)];if(ex)P.dish.up.push([ex,o]);else if(!newDish[nrm(name)]){newDish[nrm(name)]=o;P.dish.nw.push(o)}}

    let q=numIt(g(r,'qty'));const u=nrm(g(r,'u'));if(q==null){P.skip.push(sh.sheet+' riga '+row+': quantità mancante per «'+inn+'»');return}if(/^(kg|chil|l$|lt|litr)/.test(u))q*=1000;

function xlsApply(P,opt){const ingBy={};S.ing.forEach(i=>ingBy[nrm(i.name)]=i);let n={ingN:0,ingU:0,dishN:0,dishU:0,rec:0};

 P.ing.up.forEach(([i,o])=>{setIng(i,o);n.ingU++});
 P.ing.nw.forEach(o=>{const i={id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:o.name,price:null,unit:'kg',iva:10};setIng(i,Object.assign({},o,{price:o.price}));S.ing.push(i);ingBy[nrm(i.name)]=i;n.ingN++});

  if(o.pf){const f=S.fmt.find(z=>nrm(z.name)===nrm(o.pf));if(f)d.pf=f.id}if(o.pg!=null)d.pg=o.pg};
 const dishBy={};S.dishes.forEach(d=>dishBy[nrm(d.name)]=d);

 P.dish.nw.concat(P.rec.newDishes.map(name=>({name}))).forEach(o=>{const d={id:'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:o.name,sale:0,lines:[],cat:o.cat||'altri'};if(!['pizze','panini'].includes(d.cat))d.imp='none';setDish(d,o);S.dishes.push(d);dishBy[nrm(d.name)]=d;n.dishN++});
